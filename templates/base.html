<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Utopia Intel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('dashboard') }}" aria-label="Utopia Intel dashboard">
        <span class="brand-mark">UI</span>
        <span><strong>Utopia Intel</strong><small>Kingdom operations</small></span>
      </a>
      {% if session.get('authenticated') %}
        <form action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="button button-ghost" type="submit">Sign out</button>
        </form>
      {% endif %}
    </header>

    <main class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
